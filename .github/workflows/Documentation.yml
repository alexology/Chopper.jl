name: Documentation
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
permissions:
  actions: write
  contents: write
  pull-requests: read
  statuses: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Chopper.jl
      # Unregistered dependencies: docs/Project.toml and Project.toml find
      # them next to Chopper.jl through [sources] (Julia >= 1.11).
      - name: Checkout Minimap2
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Minimap2.jl
          path: Minimap2.jl
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Install dependencies
        run: julia --project=Chopper.jl/docs -e 'using Pkg; Pkg.instantiate()'
      - name: Build and deploy
        run: julia --project=Chopper.jl/docs Chopper.jl/docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
